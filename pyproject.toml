[project]
name = "py-uv_keras-xai"
version = "0.1.0"
description = "GPU environment for keras explainability (uv)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "gitpython>=3.1.53",
    "ipynbname>=2025.8.0.0",
    "jupyterlab>=4.6.1",
    "kaleido>=1.3.0",
    "matplotlib>=3.10.9",
    # 'and-cuda' Extra zieht automatisch die passenden CUDA/cuDNN-Wheels mit
    # (nur relevant/funktional unter Linux; auf macOS/Windows ohne GPU-Support)
    "nibabel>=5.4.2",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "plotly>=6.9.0",
    "pytest>=9.1.1",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "tensorflow-datasets>=4.9.10",
    "tensorflow[and-cuda]>=2.18,<3",
    # PyPI-Wheels enthalten unter Linux/Windows GPU-Support (CUDA 13, getrennt von TF-CUDA-12)
    "torch>=2.5",
    # PyPI-Wheel enthält GPU-Support (device='cuda'); nutzt nvidia-nccl-cu12, parallel zu TF/PyTorch
    "xarray>=2025.6.1",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    "jupytext>=1.16",
]

# HINWEIS: Die tf215-Gruppe wurde absichtlich entfernt.
# TF 2.15 ist mit den Haupt-Dependencies (TF 2.18) inkompatibel – uv kann keine
# gemeinsame Lösung finden und schlägt bei jedem `uv sync` fehl.
# Die tf215-Dependencies werden ausschließlich über scripts/setup_tf215_venv.sh
# in einem separaten .venv-tf215 verwaltet (requirements-tf215.txt).

[tool.uv]
# Kein eigenes Python-Package, nur eine Umgebung mit Dependencies (Skripte, Notebooks etc.)
package = false
# tf215 ist inkompatibel mit den Haupt-Dependencies (TF 2.15 vs. TF 2.18).
# Wird nur über scripts/setup_tf215_venv.sh in einem separaten .venv-tf215 installiert.
default-groups = ["dev"]

# Paarung: notebooks/ipynb_files/*.ipynb <-> notebooks/py_files/*.py
# Achtung: vorhandene Notebook-Metadaten "formats" haben Vorrang vor dieser Config.
[tool.jupytext.formats]
"notebooks/ipynb_files/" = "ipynb"
"notebooks/py_files/" = "py:percent"
