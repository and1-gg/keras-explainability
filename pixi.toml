[workspace]
name = "keras-explainability"
version = "0.1.0"
description = "GPU environment for keras explainability"
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64"]

# ============================================================
# Standard-Umgebung: TF 2.17 (Keras 3) – für XAI-Code
# ============================================================
[dependencies]
python = "3.10.*"
cudnn = "8.9.*"
cuda = "12.3.*"
pip = "*"

[pypi-dependencies]
tensorflow = { version = "==2.17.1", extras = ["and-cuda"] }
numpy = ">=1.26.4, <2"
matplotlib = ">=3.10.7, <4"
scikit-learn = ">=1.7.2, <2"
plotly = ">=6.4.0, <7"
jupytext = ">=1.18.1, <2"
jupyterlab = ">=4.5.6, <5"

[tasks]
install-ipykernel = { cmd = ["pip", "install", "ipykernel"] }
register-ipykernel = { cmd = [
    "python",
    "-m", "ipykernel", "install",
    "--user",
    "--name", "$KERNEL_NAME",
    "--display-name", "$KERNEL_NAME"
  ],  env = { KERNEL_NAME = "dementia_xai_gpu_py-3.10_tf-2.17.1_cuda-12.3" }}

# ============================================================
# Zweite Umgebung: TF 2.15 (Keras 2) – kompatibel mit
# pyment-public model.keras Dateien
# ============================================================
[feature.tf215.dependencies]
python = "3.10.*"
cudnn = "8.9.*"
cuda = "12.2.*"
pip = "*"

[feature.tf215.pypi-dependencies]
tensorflow = { version = "==2.15.1", extras = ["and-cuda"] }
numpy = ">=1.26.4, <2"
nibabel = ">=5.2.1, <6"
pandas = ">=2.2.1, <3"
tqdm = ">=4.66, <5"
omegaconf = ">=2.3, <3"
scipy = ">=1.13, <2"
matplotlib = ">=3.8.3, <4"
scikit-learn = ">=1.4, <2"
ipykernel = ">=6.29, <8"

[feature.tf215.tasks]
register-ipykernel-tf215 = { cmd = [
    "python",
    "-m", "ipykernel", "install",
    "--user",
    "--name", "keras-xai-tf215",
    "--display-name", "keras-xai-tf215 (TF 2.15 / Keras 2)"
  ]}

[environments]
default = { features = [], solve-group = "default" }
tf215   = { features = ["tf215"], solve-group = "tf215" }


